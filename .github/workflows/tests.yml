name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is what a current
        # Homebrew Python gives you on a Mac.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg
        # Without this the 5 conversion tests skip themselves. CI is the one
        # place they should always run.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install
        # No dependency resolution happens here -- the package is stdlib-only.
        run: pip install -e .

      - name: Test
        run: PYTHONPATH=src:tests python -m unittest discover -s tests -v

      - name: Check no credentials are committed
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "::error::.env is tracked by git"
            exit 1
          fi
